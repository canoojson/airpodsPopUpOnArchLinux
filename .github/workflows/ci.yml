name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install cryptography pytest
      # Los tests no necesitan hardware ni D-Bus: usan vectores sintéticos.
      - run: python -m pytest -q
      - name: Comprobar scripts
        run: |
          bash -n install.sh uninstall.sh
          shellcheck -S warning install.sh uninstall.sh
